<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blossom — write a note, grow a garden</title>

    <!-- Favicon. SVG so it scales perfectly across all sizes (browser
         tabs, bookmarks, the OS-level page-pinning some browsers do).
         theme-color tints the mobile browser chrome to the cream
         background so the page feels seamless from the address bar
         down. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FAF5EC" />

    <!-- Description shows up in Google results + as fallback in some share previews. -->
    <meta
      name="description"
      content="Tiny AI gardens you grow for people you care about. Write a note; we turn it into a custom bouquet you can send."
    />

    <!-- Open Graph — drives the rich-link previews in iMessage, Slack,
         Discord, Facebook, LinkedIn, etc. The image is /og.svg in the
         repo; on most modern platforms SVG previews fine. If you ever
         find one that doesn't (some older platforms convert lazily),
         export og.svg → og.png and swap the og:image / twitter:image
         paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="blossom — write a note, grow a garden" />
    <meta
      property="og:description"
      content="Tiny AI gardens you grow for people you care about. Write a note; we turn it into a custom bouquet you can send."
    />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="blossom — a pink illustrated flower next to the wordmark" />

    <!-- Twitter Card — almost the same data, in Twitter's preferred format. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="blossom — write a note, grow a garden" />
    <meta
      name="twitter:description"
      content="Tiny AI gardens you grow for people you care about. Write a note; we turn it into a custom bouquet you can send."
    />
    <meta name="twitter:image" content="/og.svg" />

    <!-- Resource hints for the Google Fonts request.
         - `preconnect` opens an early TLS connection to both origins
           (the CSS host and the font-file host).
         - `preload as="style"` starts the CSS fetch in the high-
           priority queue immediately, so font-face declarations
           arrive in parallel with — instead of after — the rest of
           the document parsing. The matching `<link rel="stylesheet">`
           is deduped against this preload.
         - `display=swap` in the URL means text renders in fallback
           font immediately and swaps to Fraunces when the woff2
           arrives — eliminates the invisible-text window. There's
           still a brief visible swap (FOUT) on first uncached load;
           Playfair Display is in the font stack as a closer-shape
           fallback than Georgia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
