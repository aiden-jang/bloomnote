name: Feature request
description: Suggest an improvement to writing, sending, or receiving a garden.
title: 'Idea: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the experience and any alternatives.
