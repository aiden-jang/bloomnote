name = "bloomnote"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain (bloomnote.aidenjang.com), not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the bloomnote-web Vite proxy target (packages/web/vite.config.ts).
[dev]
port = 32200

# Shared auth service, used server-side to validate sessions. Local dev overrides with
# `--var AUTH_URL:http://localhost:34100`.
[vars]
AUTH_URL = "https://accounts.aidenjang.com"

# Shared product-events dataset; the app name is recorded in index1 and blob1.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

# Garden store: `g:<shortId>` -> garden JSON. The short code IS the key (no relational schema).
# id is filled in at deploy from `wrangler kv namespace create GARDENS`.
[[kv_namespaces]]
binding = "GARDENS"
id = "17772866b1ae4b468ee00b07e65c9646"

# Durable Objects serialize per-IP limits and the shared daily AI spend cap; KV updates are not atomic.
[durable_objects]
bindings = [{ name = "COUNTERS", class_name = "Counters" }]

# Use SQLite-backed Durable Objects for free-plan compatibility; deployed classes cannot change backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counters"]

# The Worker serves the checked SPA and API together on one origin.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Provisioned on `wrangler deploy`; ignored by local `wrangler dev`.
[[routes]]
pattern = "bloomnote.aidenjang.com"
custom_domain = true

# Worker logs are available through `wrangler tail` and the Cloudflare dashboard.
[observability]
enabled = true
head_sampling_rate = 1

# Anonymous analytics has its own rate bucket, separate from sign-in and room actions.
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "9001"
simple = { limit = 60, period = 60 }
