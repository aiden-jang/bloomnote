name = "bloomnote"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain (bloomnote.aidenjang.com), not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the bloomnote-web Vite proxy target (apps/bloomnote/web/vite.config.ts).
[dev]
port = 32200

# Shared auth service, used server-side to validate sessions. Local dev overrides with
# `--var AUTH_URL:http://localhost:34100`.
[vars]
AUTH_URL = "https://accounts.aidenjang.com"

# Product events, written fire-and-forget from the /api/event route. One dataset across every app,
# with the app name in index1 and blob1, so a single query can compare them.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

# Garden store: `g:<shortId>` -> garden JSON. The short code IS the key (no relational schema).
# id is filled in at deploy from `wrangler kv namespace create GARDENS`.
[[kv_namespaces]]
binding = "GARDENS"
id = "17772866b1ae4b468ee00b07e65c9646"

# Serve the built web SPA (apps/bloomnote/web) from this same Worker so the UI and the /api/*
# routes share the bloomnote.aidenjang.com origin. run_worker_first = true → the Worker routes
# everything; /health + /api/* are the API, the app.all('*') catch-all serves assets + SPA.
# Rate limits and the daily AI spend cap. A Durable Object, not KV: KV's read-modify-write is
# not atomic, so parallel requests all read the same count and every limit was bypassable.
# Per-IP counters shard across instances (one per IP); the spend cap is a single instance.
[durable_objects]
bindings = [{ name = "COUNTERS", class_name = "Counters" }]

# sqlite, not the key-value backend: that one needs a paid plan and this app runs on free tiers.
# A class cannot change backend after it ships, so this had to be right the first time.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counters"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Provisioned on `wrangler deploy`; ignored by local `wrangler dev`.
[[routes]]
pattern = "bloomnote.aidenjang.com"
custom_domain = true

# Workers Logs — native, free-tier error/log observability. Tail live with `wrangler tail`;
# browse + query in the dashboard (Workers & Pages → the worker → Logs).
[observability]
enabled = true
head_sampling_rate = 1
