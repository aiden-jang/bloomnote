<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Social share card. Content is CENTERED (flower above the wordmark) so consumers that crop
       the 1.91:1 card toward a square (iOS/Safari share-sheet thumbnail) still show the brand
       rather than empty cream. The flower mirrors the favicon; brand surfaces stay anchored to pink. -->
  <rect width="1200" height="630" fill="#FAF5EC"/>

  <!-- Flower + wordmark only (no tagline — it turns to specks in a share-sheet thumbnail), centered -->
  <g transform="translate(600, 220)">
    <circle cx="0"   cy="-110" r="82" fill="#FF8FA3"/>
    <circle cx="95"  cy="-55"  r="82" fill="#FF8FA3"/>
    <circle cx="95"  cy="55"   r="82" fill="#FF8FA3"/>
    <circle cx="0"   cy="110"  r="82" fill="#FF8FA3"/>
    <circle cx="-95" cy="55"   r="82" fill="#FF8FA3"/>
    <circle cx="-95" cy="-55"  r="82" fill="#FF8FA3"/>
    <circle cx="0" cy="0" r="72" fill="#FFD700"/>
    <circle cx="0" cy="0" r="34" fill="#FFA500" opacity="0.4"/>
    <circle cx="-20" cy="-25" r="3" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="22"  cy="-12" r="3" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="0"   cy="20"  r="3" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <text x="600" y="535" text-anchor="middle"
    font-family="Fraunces, 'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="160" font-weight="500" fill="#2D5A1B" letter-spacing="-4">bloomnote</text>
</svg>
